<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>ひびきMIDIプレーヤー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=M+PLUS+1+Code:wght@400;600&display=swap">
<style>
/* Layout: one column deck — title, piano roll "screen", transport, then the track rack */
:root{
  --bg:#eef0f3; --panel:#ffffff; --ink:#1d2433; --muted:#6a7386; --line:#d7dce5;
  --screen:#162033; --grid:#24324d; --grid2:#1c2a42; --accent:#e2563b; --accent-ink:#fff;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"M PLUS 1 Code",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141c; --panel:#181e2a; --ink:#e6e9f0; --muted:#97a0b3; --line:#2a3242;
  --screen:#0b111c; --grid:#1d2a40; --grid2:#151f31; --accent:#f06a4f; --accent-ink:#fff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141c; --panel:#181e2a; --ink:#e6e9f0; --muted:#97a0b3; --line:#2a3242;
  --screen:#0b111c; --grid:#1d2a40; --grid2:#151f31; --accent:#f06a4f; --accent-ink:#fff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.35rem;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 span{color:var(--accent)}
.file-btn{font:inherit;font-weight:700;font-size:.9rem;border:1.5px solid var(--ink);color:var(--ink);background:transparent;border-radius:999px;padding:6px 16px;cursor:pointer}
.file-btn:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.deck{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.screen{position:relative;background:var(--screen)}
canvas{display:block;width:100%;height:240px}
.lcd{position:absolute;left:12px;top:10px;right:12px;display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:.78rem;color:#a9b8d6;pointer-events:none}
.lcd b{color:#fff;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}
.drop{position:absolute;inset:0;display:grid;place-items:center;background:rgba(226,86,59,.85);color:#fff;font-weight:700}
.controls{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.seek{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.seek input{flex:1;min-width:0}
input[type=range]{accent-color:var(--accent);height:28px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tbtn{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.tbtn.play{width:62px;height:62px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tbtn svg{width:22px;height:22px;fill:currentColor}
.knobs{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap}
.knob{display:flex;flex-direction:column;font-size:.72rem;color:var(--muted);letter-spacing:.06em}
.knob input{width:120px}
.knob output{font-family:var(--mono);color:var(--ink);font-size:.8rem}
h2{font-size:.78rem;letter-spacing:.12em;color:var(--muted);margin:4px 2px 0;font-weight:700}
.tracks{display:grid;gap:6px}
.trk{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.sw{width:10px;height:28px;border-radius:3px;flex:none}
.tinfo{flex:1;min-width:0}
.tname{font-weight:700;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmeta{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.mute{font:inherit;font-size:.78rem;font-weight:700;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer;min-width:58px}
.mute[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.trk.off{opacity:.5}
.note{font-size:.8rem;color:var(--muted);margin:0 2px}
.err{color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>ひびき<span>MIDI</span>プレーヤー</h1>
    <label class="file-btn" for="file">MIDIファイルを開く</label>
    <input id="file" type="file" accept=".mid,.midi,audio/midi,audio/x-midi">
  </header>

  <section class="deck" id="deck">
    <div class="screen">
      <canvas id="roll"></canvas>
      <div class="lcd"><b id="songName">サンプル曲（読み込み例）</b><span id="tempoInfo">♩=112</span></div>
      <div class="drop" id="drop" hidden>ここにドロップ</div>
    </div>
    <div class="controls">
      <div class="seek">
        <span id="cur">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="再生位置">
        <span id="dur">0:00</span>
      </div>
      <div class="row">
        <button class="tbtn" id="stop" aria-label="停止"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
        <button class="tbtn play" id="play" aria-label="再生"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5.5v13l11-6.5z"/></svg></button>
        <button class="tbtn" id="loop" aria-label="リピート" aria-pressed="false" title="リピート"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
        <div class="knobs">
          <label class="knob">速さ <input id="rate" type="range" min="50" max="150" step="5" value="100"><output id="rateOut">100%</output></label>
          <label class="knob">音量 <input id="vol" type="range" min="0" max="100" value="70"><output id="volOut">70</output></label>
        </div>
      </div>
      <p class="note" id="msg">スマホはマナーモードだと音が出ないことがあります。.mid ファイルを開くか、この画面にドロップしてください。</p>
    </div>
  </section>

  <h2>トラック</h2>
  <div class="tracks" id="tracks"></div>
</div>

<script>
(()=>{
const GM=["Acoustic Grand Piano","Bright Piano","Electric Grand","Honky-tonk","E.Piano 1","E.Piano 2","Harpsichord","Clavinet","Celesta","Glockenspiel","Music Box","Vibraphone","Marimba","Xylophone","Tubular Bells","Dulcimer","Drawbar Organ","Perc. Organ","Rock Organ","Church Organ","Reed Organ","Accordion","Harmonica","Bandoneon","Nylon Guitar","Steel Guitar","Jazz Guitar","Clean Guitar","Muted Guitar","Overdrive Guitar","Distortion Guitar","Guitar Harmonics","Acoustic Bass","Finger Bass","Pick Bass","Fretless Bass","Slap Bass 1","Slap Bass 2","Synth Bass 1","Synth Bass 2","Violin","Viola","Cello","Contrabass","Tremolo Strings","Pizzicato","Harp","Timpani","Strings","Slow Strings","Synth Strings 1","Synth Strings 2","Choir Aahs","Voice Oohs","Synth Voice","Orchestra Hit","Trumpet","Trombone","Tuba","Muted Trumpet","French Horn","Brass Section","Synth Brass 1","Synth Brass 2","Soprano Sax","Alto Sax","Tenor Sax","Baritone Sax","Oboe","English Horn","Bassoon","Clarinet","Piccolo","Flute","Recorder","Pan Flute","Blown Bottle","Shakuhachi","Whistle","Ocarina","Square Lead","Saw Lead","Calliope","Chiff","Charang","Voice Lead","Fifths","Bass+Lead","New Age","Warm Pad","Polysynth","Choir Pad","Bowed Pad","Metallic Pad","Halo Pad","Sweep Pad","Rain","Soundtrack","Crystal","Atmosphere","Brightness","Goblins","Echoes","Sci-fi","Sitar","Banjo","Shamisen","Koto","Kalimba","Bagpipe","Fiddle","Shanai","Tinkle Bell","Agogo","Steel Drums","Woodblock","Taiko","Melodic Tom","Synth Drum","Reverse Cymbal","Fret Noise","Breath Noise","Seashore","Bird Tweet","Telephone","Helicopter","Applause","Gunshot"];
const COLORS=["#f2a541","#5cc8ff","#ff7a8a","#8ee07a","#c49bff","#ffd84a","#4fe0c4","#ff9a5a","#9fb4ff","#f06a4f","#7fd6a0","#e9a3ff","#6ab0ff","#ffc0a0","#b6e35a","#ff6fb1"];

/* ---------- SMF parser ---------- */
function parseMidi(buf){
  const d=new DataView(buf); let p=0;
  const str=n=>{let s="";for(let i=0;i<n;i++)s+=String.fromCharCode(d.getUint8(p+i));return s};
  if(str(4)!=="MThd")throw new Error("MIDIファイルではありません（MThdが見つかりません）");
  const hlen=d.getUint32(4);const fmt=d.getUint16(8),ntr=d.getUint16(10),div=d.getUint16(12);
  if(div&0x8000)throw new Error("SMPTE形式のタイムベースには未対応です");
  p=8+hlen;
  const tempos=[]; const tracks=[];
  for(let t=0;t<ntr&&p<d.byteLength-8;t++){
    while(p<d.byteLength-8&&str(4)!=="MTrk"){p+=8+d.getUint32(p+4)}
    if(p>=d.byteLength-8)break;
    const len=d.getUint32(p+4);p+=8;const end=Math.min(p+len,d.byteLength);
    let tick=0,rs=0;const ev=[];let name="";
    const vlq=()=>{let v=0,b;do{b=d.getUint8(p++);v=(v<<7)|(b&127)}while(b&128&&p<end);return v};
    while(p<end){
      tick+=vlq();let st=d.getUint8(p);
      if(st<0x80){st=rs}else{p++; if(st<0xF0)rs=st}
      if(st===0xFF){const ty=d.getUint8(p++);const l=vlq();
        if(ty===0x51)tempos.push({tick,us:(d.getUint8(p)<<16)|(d.getUint8(p+1)<<8)|d.getUint8(p+2)});
        else if(ty===0x03&&!name){const b=new Uint8Array(buf,p,l);try{name=new TextDecoder("shift_jis").decode(b).replace(/\0/g,"").trim()}catch(e){name=String.fromCharCode(...b)}}
        else if(ty===0x2F){p+=l;break}
        p+=l;
      }else if(st===0xF0||st===0xF7){p+=vlq()}
      else{const hi=st&0xF0,ch=st&15;const a=d.getUint8(p++);const b=(hi===0xC0||hi===0xD0)?0:d.getUint8(p++);ev.push({tick,hi,ch,a,b})}
    }
    p=end;tracks.push({name,ev});
  }
  tempos.sort((a,b)=>a.tick-b.tick);if(!tempos.length||tempos[0].tick>0)tempos.unshift({tick:0,us:500000});
  // tick -> seconds
  const segs=[];let sec=0;for(let i=0;i<tempos.length;i++){if(i){sec+=(tempos[i].tick-tempos[i-1].tick)*tempos[i-1].us/1e6/div}segs.push({tick:tempos[i].tick,us:tempos[i].us,sec})}
  const toSec=tk=>{let s=segs[0];for(let i=1;i<segs.length&&segs[i].tick<=tk;i++)s=segs[i];return s.sec+(tk-s.tick)*s.us/1e6/div};
  // programs & volumes per channel across all tracks (by tick)
  const ctl=[];tracks.forEach(tr=>tr.ev.forEach(e=>{if(e.hi===0xC0)ctl.push({tick:e.tick,ch:e.ch,prog:e.a});if(e.hi===0xB0&&e.a===7)ctl.push({tick:e.tick,ch:e.ch,vol:e.b})}));
  ctl.sort((a,b)=>a.tick-b.tick);
  const at=(ch,tk,key,def)=>{let v=def;for(const c of ctl){if(c.tick>tk)break;if(c.ch===ch&&c[key]!==undefined)v=c[key]}return v};
  const out=[];
  tracks.forEach((tr,ti)=>{const open={};const notes=[];const chans=new Set();
    for(const e of tr.ev){const k=e.ch*128+e.a;
      if(e.hi===0x90&&e.b>0){(open[k]=open[k]||[]).push(e)}
      else if(e.hi===0x80||(e.hi===0x90&&e.b===0)){const s=open[k]&&open[k].shift();if(s){notes.push(mk(s,e.tick))}}}
    for(const k in open)for(const s of open[k])notes.push(mk(s,s.tick+div));
    function mk(s,et){chans.add(s.ch);const st=toSec(s.tick);return{t:st,d:Math.max(.03,toSec(et)-st),n:s.a,v:s.b/127,ch:s.ch,prog:at(s.ch,s.tick,"prog",0),cv:at(s.ch,s.tick,"vol",100)/127,tr:out.length}}
    if(notes.length){notes.sort((a,b)=>a.t-b.t);const ch=[...chans][0];
      out.push({name:tr.name||(ch===9?"ドラム":GM[notes[0].prog]),ch,prog:notes[0].prog,notes,muted:false});
      notes.forEach(n=>n.tr=out.length-1)}
  });
  if(!out.length)throw new Error("再生できるノートが見つかりませんでした");
  return{tracks:out,bpm:Math.round(60e6/tempos[0].us),fmt};
}

/* ---------- sample song (original, generated in code) ---------- */
function sample(){
  const bpm=112,b=60/bpm;const T=[{name:"メロディ（ピアノ）",ch:0,prog:0},{name:"ベース",ch:1,prog:33},{name:"コード（ストリングス）",ch:2,prog:48},{name:"ドラム",ch:9,prog:0}].map(x=>({...x,notes:[],muted:false}));
  const add=(ti,beat,len,n,v)=>T[ti].notes.push({t:beat*b,d:len*b*.95,n,v,ch:T[ti].ch,prog:T[ti].prog,cv:.8,tr:ti});
  const chords=[[60,64,67],[57,60,64],[53,57,60],[55,59,62],[60,64,67],[57,60,64],[53,57,62],[55,59,62]];
  const roots=[36,33,29,31,36,33,29,31];
  const mel=[[76,1],[74,.5],[72,.5],[74,1],[79,1],[76,1.5],[72,.5],[69,2],[69,1],[72,.5],[74,.5],[77,1],[76,.5],[74,.5],[74,2],[71,2],
             [76,1],[77,.5],[79,.5],[81,1],[79,1],[76,1],[72,1],[69,2],[69,1],[72,1],[74,1.5],[71,.5],[72,4]];
  let beat=0;for(const[n,l]of mel){add(0,beat,l,n,.85);beat+=l}
  for(let bar=0;bar<8;bar++){const s=bar*4;
    chords[bar].forEach(n=>add(2,s,4,n,.45));
    [[0,1],[1.5,.5],[2,1],[3,1]].forEach(([o,l],i)=>add(1,s+o,l,roots[bar]+(i===2?7:0),.8));
    for(let i=0;i<8;i++)add(3,s+i/2,.25,42,i%2?.4:.6);
    add(3,s,.5,36,.9);add(3,s+2.5,.5,36,.7);add(3,s+1,.5,38,.8);add(3,s+3,.5,38,.8);
  }
  add(3,0,1,49,.7);add(3,32,1,49,.7);add(1,32,4,36,.8);add(2,32,4,60,.4);add(2,32,4,64,.4);add(2,32,4,67,.4);
  T.forEach(t=>t.notes.sort((a,c)=>a.t-c.t));
  return{tracks:T,bpm};
}

/* ---------- audio ---------- */
let ac=null,master=null,noiseBuf=null;const live=new Set();
function initAudio(){
  if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(ac.destination);
  master=ac.createGain();master.gain.value=vol.value/100*.6;master.connect(comp);
  noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const c=noiseBuf.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;
}
const hz=n=>440*Math.pow(2,(n-69)/12);
function track(...nodes){const o={nodes};live.add(o);const last=nodes[0];last.onended=()=>{live.delete(o);nodes.forEach(x=>{try{x.disconnect()}catch(e){}})};return o}
function voice(nt,when,dur){
  const p=nt.prog,fam=p>>3;const amp=nt.v*nt.cv*.22;
  const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();f.type="lowpass";
  let type="triangle",perc=true,rel=.12,cut=4000,det=0;
  if(fam===0||fam===1){type="triangle";cut=3200}
  else if(fam===2){type="square";perc=false;cut=2400}
  else if(fam===3){type="sawtooth";cut=2600}
  else if(fam===4){type="triangle";cut=1200}
  else if(fam===5||fam===6||fam===11){type="sawtooth";perc=false;cut=2200;rel=.3}
  else if(fam===7){type="sawtooth";perc=false;cut=3000}
  else if(fam===8||fam===9){type="sine";perc=false;cut=5000}
  else if(fam===10){type=p%2?"sawtooth":"square";perc=false;cut=3000}
  else if(fam===12||fam===13||fam===14){type="triangle";cut=3000}
  o.type=type;o.frequency.value=hz(nt.n);f.frequency.value=cut;f.Q.value=.7;
  const end=when+dur;g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(amp,when+(perc?.004:.03));
  if(perc){g.gain.setTargetAtTime(amp*.25,when+.01,Math.max(.15,Math.min(1.2,dur*.6)))}else{g.gain.setTargetAtTime(amp*.8,when+.05,.2)}
  g.gain.setTargetAtTime(0,end,rel/3);
  o.connect(f);f.connect(g);g.connect(master);o.start(when);o.stop(end+rel*2);track(o,f,g);
}
function drum(nt,when){
  const n=nt.n,amp=nt.v*nt.cv*.5;
  if(n===35||n===36){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,when);o.frequency.exponentialRampToValueAtTime(45,when+.12);g.gain.setValueAtTime(amp*1.2,when);g.gain.exponentialRampToValueAtTime(.001,when+.3);o.connect(g);g.connect(master);o.start(when);o.stop(when+.32);track(o,g);return}
  if([41,43,45,47,48,50].includes(n)){const o=ac.createOscillator(),g=ac.createGain();const fr=80+(n-41)*12;o.frequency.setValueAtTime(fr*1.6,when);o.frequency.exponentialRampToValueAtTime(fr,when+.15);g.gain.setValueAtTime(amp,when);g.gain.exponentialRampToValueAtTime(.001,when+.35);o.connect(g);g.connect(master);o.start(when);o.stop(when+.37);track(o,g);return}
  let hp=1200,len=.18,lvl=amp*.7;
  if(n===42||n===44){hp=7000;len=.05;lvl=amp*.45}else if(n===46){hp=7000;len=.25;lvl=amp*.4}
  else if(n===49||n===57||n===52||n===55){hp=5000;len=1.2;lvl=amp*.45}else if(n===51||n===59||n===53){hp=6000;len=.5;lvl=amp*.3}
  else if(n===38||n===40||n===37||n===39){hp=1200;len=.18;lvl=amp*.75}
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noiseBuf;f.type="highpass";f.frequency.value=hp;
  g.gain.setValueAtTime(lvl,when);g.gain.exponentialRampToValueAtTime(.001,when+len);s.connect(f);f.connect(g);g.connect(master);s.start(when,Math.random()*.5);s.stop(when+len+.02);track(s,f,g);
  if(n===38||n===40){const o=ac.createOscillator(),g2=ac.createGain();o.frequency.value=190;g2.gain.setValueAtTime(amp*.5,when);g2.gain.exponentialRampToValueAtTime(.001,when+.1);o.connect(g2);g2.connect(master);o.start(when);o.stop(when+.12);track(o,g2)}
}
function silence(){live.forEach(o=>{try{o.nodes[0].stop()}catch(e){}o.nodes.forEach(x=>{try{x.disconnect()}catch(e){}})});live.clear()}

/* ---------- transport ---------- */
const $=id=>document.getElementById(id);
const play=$("play"),stopB=$("stop"),loopB=$("loop"),seek=$("seek"),rate=$("rate"),vol=$("vol");
let song=null,all=[],length=1,playing=false,pos=0,ctxStart=0,posStart=0,idx=0,timer=null,looping=false,dragging=false;
const LOOK=.2;
function now(){return playing?posStart+(ac.currentTime-ctxStart)*speed():pos}
const speed=()=>rate.value/100;
function load(s,name){
  stop();song=s;all=s.tracks.flatMap(t=>t.notes).sort((a,b)=>a.t-b.t);
  length=Math.max(...all.map(n=>n.t+n.d))+.3;$("dur").textContent=fmt(length);$("songName").textContent=name;$("tempoInfo").textContent="♩="+s.bpm;
  lo=Math.min(...all.filter(n=>n.ch!==9).map(n=>n.n),60)-3;hi=Math.max(...all.filter(n=>n.ch!==9).map(n=>n.n),72)+3;
  renderTracks();draw();
}
function seekIdx(t){idx=0;while(idx<all.length&&all[idx].t<t-.005)idx++}
function tick(){
  const p=now();const horizon=p+LOOK*speed();const sp=speed();
  while(idx<all.length&&all[idx].t<horizon){const n=all[idx++];if(song.tracks[n.tr].muted)continue;
    const when=Math.max(ac.currentTime,ctxStart+(n.t-posStart)/sp);
    if(n.ch===9)drum(n,when);else voice(n,when,n.d/sp)}
  if(p>=length){if(looping){startAt(0)}else{stop()}}
}
function startAt(t){initAudio();if(ac.state==="suspended")ac.resume();silence();posStart=t;ctxStart=ac.currentTime+.05;seekIdx(t);playing=true;clearInterval(timer);timer=setInterval(tick,25);tick();setIcon()}
function pause(){if(!playing)return;pos=now();playing=false;clearInterval(timer);silence();setIcon()}
function stop(){playing=false;clearInterval(timer);if(ac)silence();pos=0;setIcon();updateUI()}
function setIcon(){$("playIcon").innerHTML=playing?'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>':'<path d="M8 5.5v13l11-6.5z"/>';play.setAttribute("aria-label",playing?"一時停止":"再生")}
play.onclick=()=>playing?pause():startAt(pos>=length?0:pos);
stopB.onclick=stop;
loopB.onclick=()=>{looping=!looping;loopB.setAttribute("aria-pressed",looping);loopB.style.borderColor=looping?"var(--accent)":"";loopB.style.color=looping?"var(--accent)":""};
seek.oninput=()=>{dragging=true;const t=seek.value/1000*length;$("cur").textContent=fmt(t);if(!playing){pos=t;draw()}};
seek.onchange=()=>{dragging=false;const t=seek.value/1000*length;if(playing)startAt(t);else{pos=t;draw()}};
rate.oninput=()=>{$("rateOut").textContent=rate.value+"%";if(playing){const p=now();startAt(p)}};
vol.oninput=()=>{$("volOut").textContent=vol.value;if(master)master.gain.setTargetAtTime(vol.value/100*.6,ac.currentTime,.02)};
document.addEventListener("keydown",e=>{if(e.code==="Space"&&e.target.tagName!=="INPUT"){e.preventDefault();play.click()}});
const fmt=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};

function renderTracks(){
  const box=$("tracks");box.innerHTML="";
  song.tracks.forEach((t,i)=>{const el=document.createElement("div");el.className="trk"+(t.muted?" off":"");
    const inst=t.ch===9?"ドラム（ch10）":GM[t.prog]+"　ch"+(t.ch+1);
    el.innerHTML=`<span class="sw" style="background:${COLORS[i%16]}"></span><div class="tinfo"><div class="tname"></div><div class="tmeta">${inst}・${t.notes.length}音</div></div><button class="mute" id="mute${i}" aria-pressed="${t.muted}">${t.muted?"ミュート中":"ミュート"}</button>`;
    el.querySelector(".tname").textContent=t.name;
    el.querySelector("button").onclick=()=>{t.muted=!t.muted;renderTracks();if(playing)startAt(now())};
    box.appendChild(el)});
}

/* ---------- file loading ---------- */
function openFile(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{load(parseMidi(r.result),f.name);$("msg").textContent="▶ を押すと再生します。スペースキーでも再生・一時停止できます。";$("msg").className="note"}catch(e){$("msg").textContent="読み込めませんでした："+e.message;$("msg").className="note err"}};r.readAsArrayBuffer(f)}
$("file").onchange=e=>{openFile(e.target.files[0]);e.target.value=""};
const deck=$("deck"),drop=$("drop");
["dragenter","dragover"].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();drop.hidden=false}));
document.addEventListener("dragleave",e=>{if(!e.relatedTarget)drop.hidden=true});
document.addEventListener("drop",e=>{e.preventDefault();drop.hidden=true;openFile(e.dataTransfer.files[0])});

/* ---------- piano roll ---------- */
const cv=$("roll"),g=cv.getContext("2d");let lo=48,hi=84;const WIN=8;
function draw(){
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==w*dpr||cv.height!==h*dpr){cv.width=w*dpr;cv.height=h*dpr}
  g.setTransform(dpr,0,0,dpr,0,0);const css=getComputedStyle(document.documentElement);
  g.fillStyle=css.getPropertyValue("--screen");g.fillRect(0,0,w,h);
  const top=34,bot=h-8,rows=hi-lo+1,rh=(bot-top)/rows;
  for(let n=lo;n<=hi;n++){const y=bot-(n-lo+1)*rh;if([1,3,6,8,10].includes(n%12)){g.fillStyle=css.getPropertyValue("--grid2");g.fillRect(0,y,w,rh)}if(n%12===0){g.fillStyle=css.getPropertyValue("--grid");g.fillRect(0,y+rh-1,w,1)}}
  const p=now(),px=w/WIN,head=w*.25,t0=p-head/px,t1=t0+WIN;
  if(song)for(const n of all){if(n.t>t1)break;if(n.t+n.d<t0)continue;const tr=song.tracks[n.tr];
    const x=head+(n.t-p)*px,ww=Math.max(2,n.d*px-1);
    const y=n.ch===9?bot-6-((n.n%12)/12)*(bot-top)*.3:bot-(n.n-lo+1)*rh;const hh=n.ch===9?4:Math.max(2,rh-1);
    const on=n.t<=p&&p<n.t+n.d;g.globalAlpha=tr.muted?.15:(on?1:.75);g.fillStyle=COLORS[n.tr%16];
    g.fillRect(x,y,ww,hh);if(on&&!tr.muted){g.globalAlpha=.35;g.fillRect(x-2,y-2,ww+4,hh+4)}}
  g.globalAlpha=1;g.fillStyle=css.getPropertyValue("--accent");g.fillRect(head-1,top-6,2,bot-top+6);
}
function updateUI(){const p=Math.min(now(),length);if(!dragging){seek.value=Math.round(p/length*1000);$("cur").textContent=fmt(p)}draw()}
(function loop(){updateUI();requestAnimationFrame(loop)})();
window.addEventListener("resize",draw);

load(sample(),"サンプル曲（読み込み例）");
})();
</script>
